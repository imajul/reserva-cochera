name: Reserva Automática Cochera

on:
  schedule:
    # 15:55 ARG = 18:55 UTC (UTC-3)
    # Domingo  (UTC lunes 18:55)  → reserva para el lunes
    # Lunes    (UTC lunes... no, lunes ARG = lunes UTC si es antes de 21hs)
    # Cron días: domingo=0, lunes=1, martes=2, jueves=4 en UTC
    # Como ARG es UTC-3, las 18:55 UTC del domingo = 15:55 ARG del domingo ✓
    - cron: "55 18 * * 0,1,2,4"   # Dom, Lun, Mar, Jue a las 15:55 ARG

  workflow_dispatch:
    inputs:
      modo:
        description: "Modo de ejecución"
        required: true
        default: "test"
        type: choice
        options:
          - test
          - produccion

jobs:

  reservar-automatico:
    name: Reserva automática (cron)
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar dependencias
        run: pip install playwright pytz
      - name: Instalar Chromium
        run: |
          playwright install chromium
          playwright install-deps chromium
      - name: Ejecutar reserva automática
        env:
          PARKALOT_EMAIL:    ${{ secrets.PARKALOT_EMAIL }}
          PARKALOT_PASSWORD: ${{ secrets.PARKALOT_PASSWORD }}
        run: python reservar_cochera.py
      - name: Subir screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-auto-${{ github.run_id }}
          path: "*.png"
          if-no-files-found: ignore
          retention-days: 7

  reservar-manual:
    name: Reserva manual (${{ inputs.modo }})
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar dependencias
        run: pip install playwright pytz
      - name: Instalar Chromium
        run: |
          playwright install chromium
          playwright install-deps chromium
      - name: Ejecutar en modo TEST
        if: inputs.modo == 'test'
        env:
          PARKALOT_EMAIL:    ${{ secrets.PARKALOT_EMAIL }}
          PARKALOT_PASSWORD: ${{ secrets.PARKALOT_PASSWORD }}
        run: python test_reserva.py
      - name: Ejecutar en modo PRODUCCIÓN
        if: inputs.modo == 'produccion'
        env:
          PARKALOT_EMAIL:    ${{ secrets.PARKALOT_EMAIL }}
          PARKALOT_PASSWORD: ${{ secrets.PARKALOT_PASSWORD }}
        run: python reservar_cochera.py
      - name: Subir screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ inputs.modo }}-${{ github.run_id }}
          path: "*.png"
          if-no-files-found: ignore
          retention-days: 7
