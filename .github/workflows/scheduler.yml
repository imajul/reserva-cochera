name: Reserva Automática Cochera 237

on:
  schedule:
    # 15:55 ARG = 18:55 UTC (UTC-3)
    # Corre de lunes a jueves para reservar el día siguiente:
    #   Lunes    → reserva para el martes
    #   Martes   → reserva para el miércoles
    #   Miércoles→ reserva para el jueves  (no requerido, el script lo ignora)
    #   Jueves   → reserva para el viernes
    - cron: "55 18 * * 1-4"

  # Ejecución manual para pruebas
  workflow_dispatch:

jobs:
  reservar:
    name: Reservar cochera en Parkalot
    runs-on: ubuntu-latest
    timeout-minutes: 20   # margen amplio: 5 min previos + hasta 10 min de reintento

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias Python
        run: |
          pip install playwright pytz

      - name: Instalar navegador Chromium
        run: |
          playwright install chromium
          playwright install-deps chromium

      - name: Ejecutar script de reserva
        env:
          PARKALOT_EMAIL:    ${{ secrets.PARKALOT_EMAIL }}
          PARKALOT_PASSWORD: ${{ secrets.PARKALOT_PASSWORD }}
        run: |
          python reservar_cochera.py

      - name: Subir screenshot para diagnóstico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-${{ github.run_id }}
          path: |
            resultado_reserva.png
            error_reserva.png
          if-no-files-found: ignore
          retention-days: 7
