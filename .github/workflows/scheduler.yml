name: Reserva Automática Cochera

# El scheduling lo maneja cron-job.org, que llama a este workflow
# via workflow_dispatch para garantizar puntualidad.
# Endpoint: POST https://api.github.com/repos/imajul/reserva-cochera/actions/workflows/scheduler.yml/dispatches
# Body: {"ref": "main", "inputs": {"modo": "produccion"}}
# Horario: 55 18 * * 0,1,2,4  (18:55 UTC = 15:55 ARG — Dom, Lun, Mar, Mié, Jue)

on:
  workflow_dispatch:
    inputs:
      modo:
        description: "Modo de ejecución"
        required: true
        default: "produccion"
        type: choice
        options:
          - produccion
          - test

jobs:

  unit-tests:
    name: Tests unitarios
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Ejecutar tests unitarios
        run: pytest --cov=reservar_cochera --cov-report=term-missing

  reservar:
    name: Reserva (${{ inputs.modo }})
    needs: unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: false  # PAUSADO — reactivar cuando Parkalot confirme que la cuenta no está bloqueada

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Ejecutar en modo PRODUCCIÓN
        if: inputs.modo == 'produccion'
        env:
          PARKALOT_REFRESH_TOKEN: ${{ secrets.PARKALOT_REFRESH_TOKEN }}
          PARKALOT_UID:           ${{ secrets.PARKALOT_UID }}
          PARKALOT_API_KEY:       ${{ secrets.PARKALOT_API_KEY }}
          WHATSAPP_PHONE:         ${{ secrets.WHATSAPP_PHONE }}
          WHATSAPP_APIKEY:        ${{ secrets.WHATSAPP_APIKEY }}
        run: python reservar_cochera.py
      - name: Ejecutar en modo TEST
        if: inputs.modo == 'test'
        env:
          PARKALOT_REFRESH_TOKEN: ${{ secrets.PARKALOT_REFRESH_TOKEN }}
          PARKALOT_UID:           ${{ secrets.PARKALOT_UID }}
          PARKALOT_API_KEY:       ${{ secrets.PARKALOT_API_KEY }}
          WHATSAPP_PHONE:         ${{ secrets.WHATSAPP_PHONE }}
          WHATSAPP_APIKEY:        ${{ secrets.WHATSAPP_APIKEY }}
        run: python test_reserva.py
