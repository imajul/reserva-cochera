name: Reserva Automática Cochera

# El scheduling lo maneja cron-job.org, que llama a este workflow
# via workflow_dispatch para garantizar puntualidad.
# Endpoint: POST https://api.github.com/repos/imajul/reserva-cochera/actions/workflows/scheduler.yml/dispatches
# Body: {"ref": "main", "inputs": {"modo": "produccion"}}
# Horario: 55 18 * * 0,1,2,3,4  (18:55 UTC = 15:55 ARG — Dom, Lun, Mar, Mié, Jue)

on:
  workflow_dispatch:
    inputs:
      modo:
        description: "Modo de ejecución"
        required: true
        default: "produccion"
        type: choice
        options:
          - produccion
          - test

jobs:

  unit-tests:
    name: Tests unitarios
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Ejecutar tests unitarios
        run: pytest --cov=reservar_cochera --cov-report=term-missing

  reservar:
    name: Reserva (${{ inputs.modo }})
    needs: unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Instalar Chromium
        run: |
          playwright install chromium
          playwright install-deps chromium
      - name: Ejecutar en modo PRODUCCIÓN
        if: inputs.modo == 'produccion'
        env:
          PARKALOT_EMAIL:    ${{ secrets.PARKALOT_EMAIL }}
          PARKALOT_PASSWORD: ${{ secrets.PARKALOT_PASSWORD }}
          WHATSAPP_PHONE:    ${{ secrets.WHATSAPP_PHONE }}
          WHATSAPP_APIKEY:   ${{ secrets.WHATSAPP_APIKEY }}
        run: python reservar_cochera.py
      - name: Ejecutar en modo TEST
        if: inputs.modo == 'test'
        env:
          PARKALOT_EMAIL:    ${{ secrets.PARKALOT_EMAIL }}
          PARKALOT_PASSWORD: ${{ secrets.PARKALOT_PASSWORD }}
          WHATSAPP_PHONE:    ${{ secrets.WHATSAPP_PHONE }}
          WHATSAPP_APIKEY:   ${{ secrets.WHATSAPP_APIKEY }}
        run: python test_reserva.py
      - name: Subir screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ inputs.modo }}-${{ github.run_id }}
          path: "*.png"
          if-no-files-found: ignore
          retention-days: 7
